# Usage:
# conda env create -f environment.yml
# conda activate substrata
# python -m pip install -e .

name: substrata
channels:
  - conda-forge
dependencies:
  - python=3.10
  - open3d
  - opencv
  - pytorch
  - torchvision
  - pandas
  - scikit-learn
  - tqdm
  - ipywidgets
  - PyYAML
  - ffmpeg
  - pip
  - pip:
      - tqdm-joblib
      - fpdf2
      - gspread
      - net-tools
      - exifread
      - joblib
      - fastai
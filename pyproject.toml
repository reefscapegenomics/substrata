[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "substrata"
version         = "0.1.0"
description     = "3-D point-cloud analysis for coral reef photogrammetry"
readme          = "README.md"
requires-python = ">=3.9"
license         = { text = "MIT" }
authors         = [{ name = "Pim Bongaerts" }]
keywords        = [
    "photogrammetry", "point cloud", "structure from motion", "coral reef",
    "3-D reconstruction", "benthic ecology",
]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.22",
]

[project.urls]
Homepage      = "https://github.com/reefscapegenomics/substrata"
Documentation = "https://substrata.readthedocs.io/"
Issues        = "https://github.com/reefscapegenomics/substrata/issues"

[project.scripts]
substrata = "substrata.cli:main"